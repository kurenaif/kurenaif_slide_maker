<!doctype html>
<html lang="ja" data-theme="midnight-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>図とアニメーションの教材サンプル</title>
  <link rel="stylesheet" href="../../shared/slide-kit/ui/theme.css">
  <link rel="stylesheet" href="../../shared/slide-kit/ui/lesson.css">
  <link rel="stylesheet" href="../../shared/slide-kit/ui/classic-light.css">
  <link rel="stylesheet" href="../../shared/slide-kit/ui/midnight-dark.css">
  <link rel="stylesheet" href="../../shared/slide-kit/ui/formal-witch.css">
  <link rel="stylesheet" href="../../shared/slide-kit/ui/theme-picker.css">
  <script src="../../shared/slide-kit/core/themes.js"></script>
  <link rel="stylesheet" href="lesson.css">
</head>
<body>
  <main id="lesson">
    <header class="heading">
      <div class="topline"><span class="eyebrow">HEAP / VISUAL EXAMPLES</span><span class="edition">02</span></div>
      <nav id="chapters" aria-label="ページを選択"></nav>
      <h1 id="slide-title"></h1>
    </header>
    <section id="stage" aria-labelledby="slide-title"></section>
    <footer class="controls" aria-label="スライド操作">
      <div class="control-group">
        <button id="previous" aria-label="一段戻る">← 戻る</button>
        <button id="next" aria-label="次の動き、または次のページへ">次へ →</button>
        <span id="counter" aria-live="polite"></span>
      </div>
      <div class="control-group auxiliary">
        <label class="theme-picker">テーマ <select data-theme-picker aria-label="カラーテーマ"></select></label>
        <button id="reset" title="このページの先頭へ（R）">最初から</button>
        <button id="play" title="このページだけ連続再生（P）" aria-pressed="false">連続再生</button>
        <button id="notes-button" title="発表メモ（N）" aria-expanded="false" aria-controls="speaker-notes">メモ</button>
        <button id="fullscreen" title="全画面（F）">全画面</button>
      </div>
    </footer>
    <aside id="speaker-notes" hidden><h2>発表メモ</h2><p id="note-body"></p></aside>
    <p id="control-status" class="sr-only" role="status"></p>
  </main>
  <script src="../../shared/slide-kit/core/cues.js"></script>
  <script src="../../shared/slide-kit/core/arrows.js"></script>
  <script src="../../shared/slide-kit/core/presenter.js"></script>
  <script src="lesson.js"></script>
</body>
</html>
